<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Systems page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<!-- The page framework (systems-engineering skill). This file and core.js are the same for every project:
     the project's data (viewer_data.json, systems.json) and its components (listed in viewer_data.json) make it its own. -->
<style>
/* Layout: a working model on the left, the requirements that judge it on the right; selecting either drives the other. */
:root {
  --bg: #eef0f2;
  --panel: #ffffff;
  --ink: #1d2228;
  --muted: #5f6873;
  --line: #d6dbe1;
  --accent: #1f6fb2;
  --accent-soft: #e2eef8;
  --viewer: #e4e7eb;
  --pass: #2f7d4a; --pass-bg: #e3f2e8;
  --fail: #b3362b; --fail-bg: #f8e3e0;
  --open: #9a6a12; --open-bg: #f6edd8;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181c; --panel: #1c2026; --ink: #e4e8ec; --muted: #9aa3ad; --line: #2e343c;
    --accent: #5aa6e6; --accent-soft: #1d3247; --viewer: #20252c;
    --pass: #6cc58a; --pass-bg: #1d3326; --fail: #f08074; --fail-bg: #3a2220; --open: #e0b45a; --open-bg: #352b17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181c; --panel: #1c2026; --ink: #e4e8ec; --muted: #9aa3ad; --line: #2e343c;
  --accent: #5aa6e6; --accent-soft: #1d3247; --viewer: #20252c;
  --pass: #6cc58a; --pass-bg: #1d3326; --fail: #f08074; --fail-bg: #3a2220; --open: #e0b45a; --open-bg: #352b17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); display: flex; flex-direction: column; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 20px; letter-spacing: .01em; }
header .sub { color: var(--muted); font-size: 13px; }
.tally { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill.pass { background: var(--pass-bg); color: var(--pass); }
.pill.fail { background: var(--fail-bg); color: var(--fail); }
.pill.open { background: var(--open-bg); color: var(--open); }
.pill.neutral { background: var(--accent-soft); color: var(--accent); }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(340px, 1fr); }
@media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } }

.stage { position: relative; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
#view { position: relative; flex: 1; min-height: 320px; background: var(--viewer); overflow: hidden; }
#view canvas { display: block; width: 100%; height: 100%; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.dim-label { position: absolute; transform: translate(-50%, -50%); background: var(--panel); color: var(--ink); border: 1px solid var(--accent); border-radius: 4px; padding: 1px 6px; font: 12px var(--font-mono); white-space: nowrap; }
.dim-label.cg { border-color: var(--fail); }
#hover { position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); font-size: 12px; padding: 3px 8px; border-radius: 4px; display: none; max-width: 460px; }
.viewbar { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.viewbar button, .ctl button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
.viewbar button:hover, .ctl button:hover { border-color: var(--accent); color: var(--accent); }
.focus-note { position: absolute; left: 10px; bottom: 10px; right: 10px; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 8px 12px; font-size: 13px; display: none; }
.focus-note.show { display: block; }
.focus-note b { font-family: var(--font-mono); }

.ctl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 10px 16px; align-items: end; padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--line); }
@media (max-width: 600px) { .ctl { grid-template-columns: 1fr; } }
.ctl label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
.ctl label span.row { display: flex; justify-content: space-between; }
.ctl label .num { color: var(--ink); }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); }
.ctl .btns { display: flex; gap: 6px; flex-wrap: wrap; }

aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.stat { padding: 10px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; }
.stat:nth-child(3n) { border-right: 0; }
.stat:hover { background: var(--accent-soft); }
.stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stat .v { font: 500 18px var(--font-mono); font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 12px; color: var(--muted); font-weight: 400; }
.tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }
.filter { padding: 8px 14px; font-size: 12px; color: var(--muted); display: none; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); background: var(--accent-soft); }
.filter.show { display: flex; }
.filter button { margin-left: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
.pane { flex: 1; overflow-y: auto; min-height: 0; }
.pane[hidden] { display: none; }

.req { border-bottom: 1px solid var(--line); padding: 10px 14px 10px 12px; border-left: 3px solid transparent; cursor: pointer; display: grid; grid-template-columns: 38px 1fr; gap: 2px 8px; }
.req:hover { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.req.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.req .id { font: 500 12px var(--font-mono); color: var(--muted); padding-top: 2px; }
.req .txt { font-size: 13.5px; }
.req .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.req .meta .num { color: var(--ink); }
.bar { grid-column: 2; height: 4px; background: var(--line); border-radius: 2px; position: relative; margin-top: 4px; }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 2px; background: var(--pass); }
.bar.fail i { background: var(--fail); }
.bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.detail { grid-column: 2; display: none; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.req.sel .detail { display: block; }
.detail dt { font-weight: 600; color: var(--ink); margin-top: 4px; }
.detail dd { margin: 0; }
.detail ul.why { margin: 2px 0; padding-left: 16px; }
.detail table { border-collapse: collapse; width: 100%; margin-top: 4px; font-size: 12px; }
.detail td { padding: 2px 4px; border-top: 1px solid var(--line); }
.detail td.num { text-align: right; }

.node { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 54px 1fr auto; gap: 2px 8px; }
.node:hover { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.node.sel { background: var(--accent-soft); }
.node .id { font: 500 12px var(--font-mono); color: var(--muted); padding-top: 2px; }
.node .m { font: 12px var(--font-mono); color: var(--muted); }
.node .links { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 11px var(--font-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; cursor: pointer; background: var(--panel); }
.chip.pass { color: var(--pass); } .chip.fail { color: var(--fail); } .chip.open { color: var(--open); }
.item { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 38px 1fr; gap: 2px 8px; }
.item .id { font: 500 12px var(--font-mono); color: var(--muted); padding-top: 2px; }
.item .why { grid-column: 2; font-size: 12px; color: var(--muted); }
.reqbar { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.reqbar select, .reqbar input { font: inherit; font-size: 12px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.reqbar input { flex: 1; min-width: 120px; }
.reqbar button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 12px; color: var(--muted); }
.reqbar button:hover { border-color: var(--accent); color: var(--accent); }
.grp { display: flex; align-items: center; gap: 8px; padding: 10px 14px 6px; cursor: pointer; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--accent-soft) 35%, transparent); user-select: none; }
.grp .tw { width: 10px; color: var(--muted); font-size: 10px; }
.grp .gn { font: 600 12.5px var(--font-display); color: var(--ink); }
.grp .gc { margin-left: auto; display: flex; gap: 4px; }
.grp .gc .pill { font-size: 11px; padding: 1px 7px; }
.grp-body[hidden] { display: none; }
.empty { padding: 16px 14px; color: var(--muted); font-size: 13px; }
.dg { border-bottom: 1px solid var(--line); flex: none; }
.dg-head { display: flex; align-items: center; gap: 10px; padding: 6px 12px 0; font-size: 11px; color: var(--muted); }
.dg-head b { font: 600 12px var(--font-display); color: var(--ink); text-transform: uppercase; letter-spacing: .05em; }
.dg-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.dg-legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.dg-head button { margin-left: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; cursor: pointer; font-size: 11px; color: var(--muted); }
.dg-head button:hover { border-color: var(--accent); color: var(--accent); }
.dg.shut #dg-svg { display: none; }
.dg.shut .dg-head { padding-bottom: 6px; }
#dg-svg { padding: 2px 8px 4px; }
#dg-svg svg { width: 100%; height: auto; max-height: 34vh; display: block; margin: 0 auto; font-family: var(--font-body, inherit); }
.dg-frame { fill: none; stroke: var(--line); stroke-dasharray: 5 4; }
.dg-ft { font: 600 11px var(--font-display, inherit); fill: var(--muted); }
.dg-node, .dg-ext, .dg-link { cursor: pointer; transition: opacity .25s; }
.dg-node rect:first-of-type { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
.dg-node:hover rect:first-of-type, .dg-node:focus rect:first-of-type { stroke: var(--accent); }
.dg-node.sel rect:first-of-type { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-soft); }
.dg-node.hot rect:first-of-type { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 5 3; }
.dg-node.part { opacity: .6; }
.dg-node.faint, .dg-ext.faint, .dg-link.faint { opacity: .3; }
.dg-link.on.faint, .dg-link.sel.faint { opacity: 1; }
.dg-node.unbuilt { opacity: .14; }
.dg-node .bar { fill: var(--pass); } .dg-node.fail .bar { fill: var(--fail); } .dg-node.open .bar { fill: var(--open); }
.dg-node .id { font: 600 12.5px var(--font-mono, monospace); fill: var(--ink); }
.dg-node .kg { font: 10.5px var(--font-mono, monospace); fill: var(--muted); text-anchor: end; }
.dg-node .nm { font-size: 10.5px; fill: var(--muted); }
.dg-node .pl.pass { fill: var(--pass-bg); } .dg-node .pl.fail { fill: var(--fail-bg); } .dg-node .pl.open { fill: var(--open-bg); }
.dg-node .pt { font: 600 9.5px var(--font-mono, monospace); text-anchor: middle; }
.dg-node .pt.pass { fill: var(--pass); } .dg-node .pt.fail { fill: var(--fail); } .dg-node .pt.open { fill: var(--open); }
.dg-ext rect { fill: var(--panel); stroke: var(--muted); stroke-dasharray: 4 3; }
.dg-ext text { font-size: 10.5px; fill: var(--muted); text-anchor: middle; }
.dg-ext.sel rect { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-soft); stroke-dasharray: none; }
.dg-ext:hover rect, .dg-ext:focus rect { stroke: var(--accent); }
.dg-link .hit { stroke: transparent; stroke-width: 14; }
.dg-link:hover line:not(.hit), .dg-link.on line:not(.hit), .dg-link.sel line:not(.hit) { stroke: var(--accent); }
.dg-badge { fill: var(--panel); stroke: var(--line); }
.dg-link.sel .dg-badge, .dg-link.on .dg-badge { stroke: var(--accent); }
.dg-bt { font: 600 9.5px var(--font-mono, monospace); fill: var(--ink); text-anchor: middle; }
.req { scroll-margin-top: 50px; }
.lk { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-transform: none; letter-spacing: 0; }
.section-h { padding: 12px 14px 4px; font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
#err { display: none; padding: 16px; color: var(--fail); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="tally" id="tally"></div>
</header>
<main>
  <section class="stage" aria-label="3D model">
    <div id="view">
      <div id="labels"></div>
      <div id="hover"></div>
      <div class="viewbar" id="viewbar">
        <button id="v-clear" type="button">Clear selection</button>
      </div>
      <div class="focus-note" id="note"></div>
    </div>
    <div class="ctl" id="ctl">
      <div class="btns" id="ctl-btns"></div>
    </div>
  </section>
  <aside aria-label="Systems engineering">
    <div class="stats" id="stats"></div>
    <section class="dg" id="dg" aria-label="Block diagram">
      <div class="dg-head"><b>Block diagram</b><span class="dg-legend" id="dg-legend"></span><button type="button" id="dg-fold" aria-expanded="true" aria-controls="dg-svg">Hide</button></div>
      <div id="dg-svg"></div>
    </section>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="filter" id="filter"><span id="filter-t"></span><button type="button" id="filter-x">Show all</button></div>
    <div id="panes"></div>
    <div id="err"></div>
  </aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="core.js"></script>
</body>
</html>
