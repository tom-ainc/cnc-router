<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilted-Bed CNC Router</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a working model on the left, the requirements that judge it on the right; selecting either drives the other. */
:root {
  --bg: #eef0f2;
  --panel: #ffffff;
  --ink: #1d2228;
  --muted: #5f6873;
  --line: #d6dbe1;
  --accent: #1f6fb2;
  --accent-soft: #e2eef8;
  --viewer: #e4e7eb;
  --pass: #2f7d4a; --pass-bg: #e3f2e8;
  --fail: #b3362b; --fail-bg: #f8e3e0;
  --open: #9a6a12; --open-bg: #f6edd8;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181c; --panel: #1c2026; --ink: #e4e8ec; --muted: #9aa3ad; --line: #2e343c;
    --accent: #5aa6e6; --accent-soft: #1d3247; --viewer: #20252c;
    --pass: #6cc58a; --pass-bg: #1d3326; --fail: #f08074; --fail-bg: #3a2220; --open: #e0b45a; --open-bg: #352b17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181c; --panel: #1c2026; --ink: #e4e8ec; --muted: #9aa3ad; --line: #2e343c;
  --accent: #5aa6e6; --accent-soft: #1d3247; --viewer: #20252c;
  --pass: #6cc58a; --pass-bg: #1d3326; --fail: #f08074; --fail-bg: #3a2220; --open: #e0b45a; --open-bg: #352b17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); display: flex; flex-direction: column; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 20px; letter-spacing: .01em; }
header .sub { color: var(--muted); font-size: 13px; }
.tally { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill.pass { background: var(--pass-bg); color: var(--pass); }
.pill.fail { background: var(--fail-bg); color: var(--fail); }
.pill.open { background: var(--open-bg); color: var(--open); }
.pill.neutral { background: var(--accent-soft); color: var(--accent); }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(340px, 1fr); }
@media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } }

.stage { position: relative; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
#view { position: relative; flex: 1; min-height: 320px; background: var(--viewer); overflow: hidden; }
#view canvas { display: block; width: 100%; height: 100%; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.dim-label { position: absolute; transform: translate(-50%, -50%); background: var(--panel); color: var(--ink); border: 1px solid var(--accent); border-radius: 4px; padding: 1px 6px; font: 12px var(--font-mono); white-space: nowrap; }
.dim-label.cg { border-color: var(--fail); }
#hover { position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); font-size: 12px; padding: 3px 8px; border-radius: 4px; display: none; max-width: 460px; }
.viewbar { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.viewbar button, .ctl button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
.viewbar button:hover, .ctl button:hover { border-color: var(--accent); color: var(--accent); }
.focus-note { position: absolute; left: 10px; bottom: 10px; right: 10px; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 8px 12px; font-size: 13px; display: none; }
.focus-note.show { display: block; }
.focus-note b { font-family: var(--font-mono); }

.ctl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 10px 16px; align-items: end; padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--line); }
@media (max-width: 600px) { .ctl { grid-template-columns: 1fr; } }
.ctl label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
.ctl label span.row { display: flex; justify-content: space-between; }
.ctl label .num { color: var(--ink); }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); }
.ctl .btns { display: flex; gap: 6px; flex-wrap: wrap; }

aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.stat { padding: 10px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; }
.stat:nth-child(3n) { border-right: 0; }
.stat:hover { background: var(--accent-soft); }
.stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stat .v { font: 500 18px var(--font-mono); font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 12px; color: var(--muted); font-weight: 400; }
.tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }
.filter { padding: 8px 14px; font-size: 12px; color: var(--muted); display: none; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); background: var(--accent-soft); }
.filter.show { display: flex; }
.filter button { margin-left: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
.pane { flex: 1; overflow-y: auto; min-height: 0; }
.pane[hidden] { display: none; }

.req { border-bottom: 1px solid var(--line); padding: 10px 14px 10px 12px; border-left: 3px solid transparent; cursor: pointer; display: grid; grid-template-columns: 38px 1fr; gap: 2px 8px; }
.req:hover { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.req.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.req .id { font: 500 12px var(--font-mono); color: var(--muted); padding-top: 2px; }
.req .txt { font-size: 13.5px; }
.req .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.req .meta .num { color: var(--ink); }
.bar { grid-column: 2; height: 4px; background: var(--line); border-radius: 2px; position: relative; margin-top: 4px; }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 2px; background: var(--pass); }
.bar.fail i { background: var(--fail); }
.bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.detail { grid-column: 2; display: none; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.req.sel .detail { display: block; }
.detail dt { font-weight: 600; color: var(--ink); margin-top: 4px; }
.detail dd { margin: 0; }
.detail table { border-collapse: collapse; width: 100%; margin-top: 4px; font-size: 12px; }
.detail td { padding: 2px 4px; border-top: 1px solid var(--line); }
.detail td.num { text-align: right; }

.node { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 54px 1fr auto; gap: 2px 8px; }
.node:hover { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.node.sel { background: var(--accent-soft); }
.node .id { font: 500 12px var(--font-mono); color: var(--muted); padding-top: 2px; }
.node .m { font: 12px var(--font-mono); color: var(--muted); }
.node .links { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 11px var(--font-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; cursor: pointer; background: var(--panel); }
.chip.pass { color: var(--pass); } .chip.fail { color: var(--fail); } .chip.open { color: var(--open); }
.item { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 38px 1fr; gap: 2px 8px; }
.item .id { font: 500 12px var(--font-mono); color: var(--muted); padding-top: 2px; }
.item .why { grid-column: 2; font-size: 12px; color: var(--muted); }
.asm-bar { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 14px; display: grid; gap: 6px; }
.asm-bar .row2 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.asm-bar button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.asm-bar button:hover { border-color: var(--accent); color: var(--accent); }
.asm-bar input[type=range] { width: 100%; accent-color: var(--accent); }
.step { border-bottom: 1px solid var(--line); padding: 8px 14px 8px 12px; border-left: 3px solid transparent; cursor: pointer; display: grid; grid-template-columns: 38px 1fr; gap: 2px 8px; }
.step:hover { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.step.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.step.done { opacity: .62; }
.step .id { font: 500 12px var(--font-mono); color: var(--muted); padding-top: 2px; }
.step .t { font-size: 13.5px; font-weight: 500; }
.step .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--muted); }
.step .body { grid-column: 2; font-size: 13px; display: none; }
.step.sel .body { display: block; }
.step .body dl { margin: 6px 0 2px; display: grid; grid-template-columns: 74px 1fr; gap: 3px 8px; font-size: 12px; }
.step .body dt { color: var(--muted); }
.step .body dd { margin: 0; }
.reqbar { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.reqbar select, .reqbar input { font: inherit; font-size: 12px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.reqbar input { flex: 1; min-width: 120px; }
.reqbar button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 12px; color: var(--muted); }
.reqbar button:hover { border-color: var(--accent); color: var(--accent); }
.grp { display: flex; align-items: center; gap: 8px; padding: 10px 14px 6px; cursor: pointer; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--accent-soft) 35%, transparent); user-select: none; }
.grp .tw { width: 10px; color: var(--muted); font-size: 10px; }
.grp .gn { font: 600 12.5px var(--font-display); color: var(--ink); }
.grp .gc { margin-left: auto; display: flex; gap: 4px; }
.grp .gc .pill { font-size: 11px; padding: 1px 7px; }
.grp-body[hidden] { display: none; }
.empty { padding: 16px 14px; color: var(--muted); font-size: 13px; }
.dg { border-bottom: 1px solid var(--line); flex: none; }
.dg-head { display: flex; align-items: center; gap: 10px; padding: 6px 12px 0; font-size: 11px; color: var(--muted); }
.dg-head b { font: 600 12px var(--font-display); color: var(--ink); text-transform: uppercase; letter-spacing: .05em; }
.dg-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.dg-legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.dg-head button { margin-left: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; cursor: pointer; font-size: 11px; color: var(--muted); }
.dg-head button:hover { border-color: var(--accent); color: var(--accent); }
.dg.shut #dg-svg { display: none; }
.dg.shut .dg-head { padding-bottom: 6px; }
#dg-svg { padding: 2px 8px 4px; }
#dg-svg svg { width: 100%; height: auto; max-height: 34vh; display: block; margin: 0 auto; font-family: var(--font-body, inherit); }
.dg-frame { fill: none; stroke: var(--line); stroke-dasharray: 5 4; }
.dg-ft { font: 600 11px var(--font-display, inherit); fill: var(--muted); }
.dg-node, .dg-ext, .dg-link { cursor: pointer; transition: opacity .25s; }
.dg-node rect:first-of-type { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
.dg-node:hover rect:first-of-type, .dg-node:focus rect:first-of-type { stroke: var(--accent); }
.dg-node.sel rect:first-of-type { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-soft); }
.dg-node.hot rect:first-of-type { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 5 3; }
.dg-node.part { opacity: .6; }
.dg-node.faint, .dg-ext.faint, .dg-link.faint { opacity: .3; }
.dg-link.on.faint, .dg-link.sel.faint { opacity: 1; }
.dg-node.unbuilt { opacity: .14; }
.dg-node .bar { fill: var(--pass); } .dg-node.fail .bar { fill: var(--fail); } .dg-node.open .bar { fill: var(--open); }
.dg-node .id { font: 600 12.5px var(--font-mono, monospace); fill: var(--ink); }
.dg-node .kg { font: 10.5px var(--font-mono, monospace); fill: var(--muted); text-anchor: end; }
.dg-node .nm { font-size: 10.5px; fill: var(--muted); }
.dg-node .pl.pass { fill: var(--pass-bg); } .dg-node .pl.fail { fill: var(--fail-bg); } .dg-node .pl.open { fill: var(--open-bg); }
.dg-node .pt { font: 600 9.5px var(--font-mono, monospace); text-anchor: middle; }
.dg-node .pt.pass { fill: var(--pass); } .dg-node .pt.fail { fill: var(--fail); } .dg-node .pt.open { fill: var(--open); }
.dg-ext rect { fill: var(--panel); stroke: var(--muted); stroke-dasharray: 4 3; }
.dg-ext text { font-size: 10.5px; fill: var(--muted); text-anchor: middle; }
.dg-ext.sel rect { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-soft); stroke-dasharray: none; }
.dg-ext:hover rect, .dg-ext:focus rect { stroke: var(--accent); }
.dg-link .hit { stroke: transparent; stroke-width: 14; }
.dg-link:hover line:not(.hit), .dg-link.on line:not(.hit), .dg-link.sel line:not(.hit) { stroke: var(--accent); }
.dg-badge { fill: var(--panel); stroke: var(--line); }
.dg-link.sel .dg-badge, .dg-link.on .dg-badge { stroke: var(--accent); }
.dg-bt { font: 600 9.5px var(--font-mono, monospace); fill: var(--ink); text-anchor: middle; }
.step[hidden], .section-h[hidden] { display: none; }
.step { scroll-margin-top: 84px; }
.req { scroll-margin-top: 50px; }
.lk { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-transform: none; letter-spacing: 0; }
.section-h { padding: 12px 14px 4px; font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
#err { display: none; padding: 16px; color: var(--fail); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Tilted-bed CNC router · 2400 × 1200</h1>
    <div class="sub">Concept design, bed 10° from vertical, salvaged 9 kW ISO30 spindle on a 240 V 15 A circuit</div>
  </div>
  <div class="tally" id="tally"></div>
</header>
<main>
  <section class="stage" aria-label="3D model">
    <div id="view">
      <div id="labels"></div>
      <div id="hover"></div>
      <div class="viewbar">
        <button id="v-iso" type="button">Iso</button>
        <button id="v-side" type="button">Side</button>
        <button id="v-front" type="button">Front</button>
        <button id="v-clear" type="button">Clear selection</button>
      </div>
      <div class="focus-note" id="note"></div>
    </div>
    <div class="ctl">
      <label for="ax-x"><span class="row">X, along the sheet <span class="num" id="ax-x-v"></span></span><input id="ax-x" type="range" step="1"></label>
      <label for="ax-y"><span class="row">Y, up the bed <span class="num" id="ax-y-v"></span></span><input id="ax-y" type="range" step="1"></label>
      <label for="ax-z"><span class="row">Z, tool tip off the spoilboard <span class="num" id="ax-z-v"></span></span><input id="ax-z" type="range" step="1"></label>
      <div class="btns">
        <button id="b-park" type="button">Park for loading</button>
        <button id="b-tour" type="button">Run all axes</button>
      </div>
    </div>
  </section>
  <aside aria-label="Systems engineering">
    <div class="stats" id="stats"></div>
    <section class="dg" id="dg" aria-label="Block diagram">
      <div class="dg-head"><b>Block diagram</b><span class="dg-legend" id="dg-legend"></span><button type="button" id="dg-fold" aria-expanded="true" aria-controls="dg-svg">Hide</button></div>
      <div id="dg-svg"></div>
    </section>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-pane="p-req" id="t-req">Requirements</button>
      <button role="tab" aria-selected="false" data-pane="p-asm" id="t-asm">Build</button>
      <button role="tab" aria-selected="false" data-pane="p-tree" id="t-tree">Product tree</button>
      <button role="tab" aria-selected="false" data-pane="p-if" id="t-if">Interfaces</button>
      <button role="tab" aria-selected="false" data-pane="p-as" id="t-as">Assumptions</button>
    </div>
    <div class="filter" id="filter"><span id="filter-t"></span><button type="button" id="filter-x">Show all</button></div>
    <div class="pane" id="p-req" role="tabpanel"></div>
    <div class="pane" id="p-asm" role="tabpanel" hidden></div>
    <div class="pane" id="p-tree" role="tabpanel" hidden></div>
    <div class="pane" id="p-if" role="tabpanel" hidden></div>
    <div class="pane" id="p-as" role="tabpanel" hidden></div>
    <div id="err"></div>
  </aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  let V, S;
  try {
    [V, S] = await Promise.all([fetch("viewer_data.json").then(r => r.json()), fetch("systems.json").then(r => r.json())]);
  } catch (e) {
    $("err").style.display = "block"; $("err").textContent = "The model data did not load: " + e.message; return;
  }
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fmt = (v, d) => v == null ? "–" : (Math.abs(v) >= 100 || d === 0 ? Math.round(v).toLocaleString("en-AU") : (+v.toPrecision(3)).toString());

  // ------------------------------------------------------------- systems data
  const reqs = S.requirements;
  const res = Object.fromEntries(S.results.map(r => [r.requirement, r]));
  const nodes = Object.fromEntries(S.nodes.map(n => [n.id, n]));
  const status = (id) => { const s = (res[id] || {}).status; return s === "pass" ? "pass" : s === "fail" ? "fail" : "open"; };
  const statusWord = { pass: "Pass", fail: "Fail", open: "Not checked by model" };
  const partToNode = {};
  S.nodes.forEach(n => (n.shows || []).forEach(p => { partToNode[p] = n.id; }));
  const nodeParts = (id) => id === "P" ? [] : (nodes[id]?.shows || []);
  const reqsOfNode = (nid) => reqs.filter(r => r.applies_to.includes(nid));

  // tally
  const counts = { pass: 0, fail: 0, open: 0 };
  reqs.forEach(r => counts[status(r.id)]++);
  $("tally").innerHTML = `<span class="pill pass">${counts.pass} pass</span>` +
    (counts.fail ? `<span class="pill fail">${counts.fail} fail</span>` : "") +
    `<span class="pill open">${counts.open} not checked by model</span>` +
    `<span class="pill neutral">${S.assumptions.length} assumptions</span>`;

  // stat tiles: each opens the requirement behind it
  const st = V.stats;
  const tiles = [
    ["Height", fmt(st.height), "mm", "R6", "/ 1800"],
    ["Depth parked", fmt(st.parked_depth), "mm", "R8", "/ 1000"],
    ["Depth cutting", fmt(st.envelope_depth), "mm", "R8", ""],
    ["Spindle power", (st.spindle_power / 1000).toFixed(2), "kW", "R26", "on 15 A"],
    ["Circuit draw", st.circuit_a.toFixed(1), "A", "R25", "/ 12 cont."],
    ["Mass", fmt(st.mass), "kg", "R15", "with sheet"],
  ];
  $("stats").innerHTML = tiles.map(([k, v, u, r, x]) =>

      const cs = caseStatus(st);
      const worst = cs.some(c => c.status === "fail") ? "fail" : cs.length ? "pass" : null;
      const pills = (worst ? `<span class="pill ${worst}">${worst === "fail" ? "Fails a check" : cs.length + (cs.length > 1 ? " checks pass" : " check passes")}</span>` : "") +
        (st.lift ? `<span>${st.lift.force} kg each · ${st.lift.how}</span>` : "") +
        (st.adds.length ? `<span>${st.adds.length} part${st.adds.length > 1 ? "s" : ""}</span>` : "") +
        ((st.fasteners || []).length ? `<span>${st.fasteners.reduce((a, f) => a + f.n, 0)} fasteners</span>` : "") +
        ((st.welds || []).length ? `<span>${st.welds.length} weld${st.welds.length > 1 ? "s" : ""}</span>` : "") +
        (st.moves ? `<span>fits the ${st.moves.replace(/_/g, " ")}</span>` : "") +
        (st.unit ? `<span>on the bench</span>` : "");
      const checks = cs.map(c => `<div><span class="pill ${c.status}">${c.req}</span> ${c.case.slice(st.id.length + 1)}${c.req === "R58" ? `: <span class="num">${fmt(c.measured)} kg each</span>` : ""}</div>`).join("");
      html += `<div class="step" id="step-${i}" data-ix="${i}" tabindex="0"><div class="id">${st.id}</div><div class="t">${st.title}</div>
        <div class="meta">${pills}</div>
        <div class="body"><p style="margin:6px 0">${st.text}</p><dl>
          ${st.tools.length ? `<dt>Tools</dt><dd>${st.tools.join(", ")}</dd>` : ""}
          ${st.fixture ? `<dt>Temporary</dt><dd>${st.fixture}</dd>` : ""}
          ${st.why ? `<dt>Why</dt><dd>${st.why}</dd>` : ""}
          ${(st.fasteners || []).length ? `<dt>Fasteners</dt><dd>${st.fasteners.map(f => `${f.n} × ${f.label} — ${f.tool}${f.torque ? `, ${f.torque} N·m` : ""}`).join("<br>")}</dd>` : ""}
          ${(st.welds || []).length ? `<dt>Welds</dt><dd>${st.welds.map(w => `${w.a.split(".").pop()} to ${w.b.split(".").pop()}: ${w.how}`).join("<br>")}</dd>` : ""}
          ${st.adds.length ? `<dt>Parts</dt><dd>${st.adds.join(", ")}</dd>` : ""}
          ${st.moves ? `<dt>Fits</dt><dd>the ${st.moves.replace(/_/g, " ")} built in ${asmSteps.filter(s => s.unit === st.moves).map(s => s.id).join(", ")}</dd>` : ""}
          ${checks ? `<dt>Checks</dt><dd>${checks}</dd>` : ""}
        </dl></div></div>`;
    });
    $("p-asm").innerHTML = html;
    $("asm-prev").onclick = () => { stopPlay(); goStep(stepIx - 1); };
    $("asm-next").onclick = () => { stopPlay(); goStep(stepIx + 1); };
    $("asm-play").onclick = play;
    $("asm-exit").onclick = () => { exitBuild(); showTab("p-req"); };
    $("asm-slider").addEventListener("input", e => { stopPlay(); goStep(+e.target.value, false); });
    $("p-asm").querySelectorAll(".step").forEach(el => {
      el.addEventListener("click", () => { stopPlay(); goStep(+el.dataset.ix); });
      el.addEventListener("keydown", e => { if (e.key === "Enter") { stopPlay(); goStep(+el.dataset.ix); } });
    });
  }

  // ------------------------------------------------------------- block diagram: always on top, it sets the focus every tab filters by
  // and shows what the 3D view shows: blocks fade with their parts, the current build step's blocks are outlined
  const DG = {
    nodes: { ZA: [290, 14], SP: [470, 14], YC: [290, 90], ELEC: [104, 112], GAN: [290, 166], ATC: [470, 152], BASE: [104, 248], BED: [290, 248] },
    ext: { dust: [8, 24, ["ZA"]], supply: [8, 84, ["ELEC"]], air: [8, 140, ["ELEC"]], operator: [8, 190, ["BED", "ELEC"]],
           floor: [8, 274, ["BASE"]], sheet: [480, 262, ["BED"]] },
    W: 128, H: 54, w: 76, h: 24,
  };
  const KIND_COL = { mechanical: "var(--muted)", electrical: "#d08a1c", fluid: "#2f7fbf" };
  const linkKey = (L) => [L.a, L.b].sort().join("|");
  const dgName = (x) => x.startsWith("ext:") ? x.slice(4) + " (outside)" : `${x} · ${nodes[x]?.name.split(/[:,(]/)[0] || ""}`;
  let dgSel = null, focus = null;
  function dgNodeStatus(id) {
    const c = { pass: 0, fail: 0, open: 0 };
    reqsOfNode(id).forEach(r => c[status(r.id)]++);
    return c;
  }
  const DG_LINKS = (function () {
    const m = new Map();
    const add = (a, b, i) => { const k = [a, b].sort().join("|"); if (!m.has(k)) m.set(k, { a, b, items: [], kinds: new Set() }); m.get(k).items.push(i); m.get(k).kinds.add(i.kind); };
    for (const i of S.interfaces) {
      if (i.a === i.b) continue;
      if (i.b.startsWith("external:")) { const e = i.b.slice(9); for (const t of (DG.ext[e] || [0, 0, []])[2]) add("ext:" + e, t, i); continue; }
      add(i.a, i.b, i);
    }
    return [...m.values()];
  })();
  function dgPos(id) {
    if (id.startsWith("ext:")) { const e = DG.ext[id.slice(4)]; return [e[0], e[1], DG.w, DG.h]; }
    const p = DG.nodes[id]; return [p[0], p[1], DG.W, DG.H];
  }
  function dgEdge(a, b) {
    const [ax, ay, aw, ah] = dgPos(a), [bx, by, bw, bh] = dgPos(b);
    const ca = [ax + aw / 2, ay + ah / 2], cb = [bx + bw / 2, by + bh / 2];
    const clip = (c, w, h, t) => {           // where the line from c towards t leaves the box
      const dx = t[0] - c[0], dy = t[1] - c[1];
      const s = Math.min(Math.abs((w / 2) / (dx || 1e-9)), Math.abs((h / 2) / (dy || 1e-9)));
      return [c[0] + dx * s, c[1] + dy * s];
    };
    return [clip(ca, aw, ah, cb), clip(cb, bw, bh, ca)];
  }
  function renderDiagram() {
    const isSel = (id) => dgSel && dgSel.type === "node" && dgSel.id === id;
    let svg = `<svg viewBox="0 0 700 314" role="img" aria-label="Block diagram: the machine's blocks, the things outside it and the interfaces between them. Click one to filter the tabs below.">
      <defs><marker id="dg-dot" viewBox="0 0 6 6" refX="3" refY="3" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7"><circle cx="3" cy="3" r="2.4" fill="var(--muted)"/></marker></defs>
      <rect x="96" y="4" width="508" height="306" rx="12" class="dg-frame"/>
      <text x="106" y="20" class="dg-ft">P · whole machine</text>`;
    const badges = [];
    for (const L of DG_LINKS) {
      const [[x1, y1], [x2, y2]] = dgEdge(L.a, L.b);
      const kind = L.kinds.size === 1 ? [...L.kinds][0] : (L.kinds.has("electrical") ? "electrical" : "mechanical");
      const key = linkKey(L);
      const sel = dgSel && dgSel.type === "link" && dgSel.key === key;
      const on = dgSel && dgSel.type === "node" && (L.a === dgSel.id || L.b === dgSel.id);
      let mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      for (const t of [0.5, 0.3, 0.7, 0.2, 0.8]) {   // keep count badges apart
        mx = x1 + (x2 - x1) * t; my = y1 + (y2 - y1) * t;
        if (L.items.length < 2 || badges.every(([bx, by]) => Math.hypot(bx - mx, by - my) > 19)) break;
      }
      if (L.items.length > 1) badges.push([mx, my]);
      svg += `<g class="dg-link${sel ? " sel" : ""}${on ? " on" : ""}" data-key="${key}" data-a="${L.a}" data-b="${L.b}" tabindex="0" role="button" aria-label="${L.items.length} interfaces between ${L.a} and ${L.b}">
        <title>${L.items.map(i => `${i.id} ${i.kind}: ${i.text}`).join("\n")}</title>
        <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="hit"/>
        <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${KIND_COL[kind]}" stroke-width="${1.5 + Math.min(4, L.items.length)}" ${L.kinds.has("fluid") && L.kinds.size > 1 ? 'stroke-dasharray="7 4"' : ""} marker-start="url(#dg-dot)" marker-end="url(#dg-dot)"/>
        ${L.items.length > 1 ? `<circle cx="${mx}" cy="${my}" r="8.5" class="dg-badge"/><text x="${mx}" y="${my + 3.5}" class="dg-bt">${L.items.length}</text>` : ""}
      </g>`;
    }
    for (const [e, [x, y]] of Object.entries(DG.ext)) {
      const id = "ext:" + e;
      svg += `<g class="dg-ext${isSel(id) ? " sel" : ""}" data-node="${id}" tabindex="0" role="button" aria-label="outside: ${e}">
        <rect x="${x}" y="${y}" width="${DG.w}" height="${DG.h}" rx="12"/><text x="${x + DG.w / 2}" y="${y + DG.h / 2 + 4}">${e}</text></g>`;
    }
    for (const [id, [x, y]] of Object.entries(DG.nodes)) {
      const n = nodes[id]; if (!n) continue;
      const c = dgNodeStatus(id), worst = c.fail ? "fail" : c.open ? "open" : "pass";
      const kg = n.mass_kg != null ? `${Math.round(n.mass_kg)} kg` : "";
      const nm = n.name.split(/[:,(]/)[0], short = nm.length > 20 ? nm.slice(0, 19).trim() + "…" : nm;
      const pills = [["fail", c.fail], ["pass", c.pass], ["open", c.open]].filter(([, v]) => v);
      let px = x + 10;
      svg += `<g class="dg-node ${worst}${isSel(id) ? " sel" : ""}" data-node="${id}" tabindex="0" role="button" aria-label="${id}: ${n.name}">
        <title>${id} · ${n.name}${kg ? " · " + kg : ""}\n${c.pass} pass, ${c.fail} fail, ${c.open} not checked by model</title>
        <rect x="${x}" y="${y}" width="${DG.W}" height="${DG.H}" rx="7"/><rect x="${x}" y="${y}" width="5" height="${DG.H}" rx="2" class="bar"/>
        <text x="${x + 11}" y="${y + 16}" class="id">${id}</text><text x="${x + DG.W - 7}" y="${y + 16}" class="kg">${kg}</text>
        <text x="${x + 11}" y="${y + 30}" class="nm">${short}</text>`;
      for (const [s, v] of pills) { const w = 9 + String(v).length * 7; svg += `<rect x="${px}" y="${y + 36}" width="${w}" height="13" rx="6.5" class="pl ${s}"/><text x="${px + w / 2}" y="${y + 46}" class="pt ${s}">${v}</text>`; px += w + 4; }
      svg += `</g>`;
    }
    svg += `</svg>`;
    $("dg-svg").innerHTML = svg;
    dgLast = "";
    $("dg-svg").querySelectorAll("[data-node]").forEach(el => {
      const go = () => { const id = el.dataset.node; setFocus(isSel(id) ? null : { type: "node", id }); };
      el.addEventListener("click", go); el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    });
    $("dg-svg").querySelectorAll(".dg-link").forEach(el => {
      const go = () => { const k = el.dataset.key; setFocus(dgSel && dgSel.key === k ? null : { type: "link", key: k }); };
      el.addEventListener("click", go); el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    });
  }
  $("dg-legend").innerHTML = Object.entries(KIND_COL).map(([k, c]) => `<span><i style="background:${c}"></i>${k}</span>`).join("") +
    `<span class="dg-hint">faded: hidden or faint in 3D · outlined: in this build step</span>`;
  const dgOpen = () => !$("dg").classList.contains("shut");
  $("dg-fold").addEventListener("click", () => {
    const shut = $("dg").classList.toggle("shut");
    $("dg-fold").textContent = shut ? "Show" : "Hide"; $("dg-fold").setAttribute("aria-expanded", !shut);
    store.set("dgShut", shut ? "1" : "");
  });
  if (store.get("dgShut", "")) { $("dg").classList.add("shut"); $("dg-fold").textContent = "Show"; $("dg-fold").setAttribute("aria-expanded", "false"); }

  // the focus: what a block, line or outside thing stands for in every tab
  function focusOf(sel) {
    if (!sel) return null;
    let ns, items, label;
    if (sel.type === "link") {
      const L = DG_LINKS.find(l => linkKey(l) === sel.key); if (!L) return null;
      ns = [L.a, L.b].filter(x => !x.startsWith("ext:")); items = L.items;
      label = `${dgName(L.a)} ↔ ${dgName(L.b)}`;
    } else if (sel.id.startsWith("ext:")) {
      const e = sel.id.slice(4);
      ns = (DG.ext[e] || [0, 0, []])[2]; items = S.interfaces.filter(i => i.b === "external:" + e);
      label = `${e} (outside), touching ${ns.join(" and ")}`;
    } else {
      ns = [sel.id]; items = DG_LINKS.filter(l => l.a === sel.id || l.b === sel.id).flatMap(l => l.items);
      label = dgName(sel.id);
    }
    const nset = new Set(ns);
    return { sel, nodes: nset, ifaces: new Set(items.map(i => i.id)), label,
             reqs: new Set(reqs.filter(r => r.applies_to.some(n => nset.has(n))).map(r => r.id)) };
  }
  // which block a part belongs to: its own name, or the part or assembly name it sits under
  const nodeOfName = {};
  function nodeOfPart(name) {
    if (name in nodeOfName) return nodeOfName[name];
    let hit = null;
    for (const n of S.nodes) for (const e of n.shows || []) if (name === e || name.startsWith(e + ".") || e.startsWith(name + ".")) hit = hit || n.id;
    return nodeOfName[name] = hit;
  }
  const stepNodes = asmSteps.map(st => new Set([...st.adds, ...(st.welds || []).flatMap(w => [w.a, w.b]), ...Object.keys(st.legs_of || {})].map(nodeOfPart).filter(Boolean)));
  // fitting a bench-built unit touches every block the unit was built from
  asmSteps.forEach((st, i) => { if (st.moves) asmSteps.forEach((u, j) => { if (u.unit === st.moves) stepNodes[j].forEach(n => stepNodes[i].add(n)); }); });
  // the build step a focus stands for: a block's first step; a line's first step that joins both ends,
  // else the step where the later of the two first appears
  function focusStep(f) {
    if (!f || !f.nodes.size) return -1;
    const ns = [...f.nodes], touches = (i, n) => stepNodes[i].has(n);
    if (f.sel.type === "link" && ns.length === 2) {
      // a mechanical joint is made when the later block arrives; cables and hoses when a step works on both ends
      const L = DG_LINKS.find(l => linkKey(l) === f.sel.key);
      const later = Math.max(...ns.map(n => asmSteps.findIndex((_, i) => touches(i, n))));
      if (L && L.kinds.has("mechanical")) return later;
      const both = asmSteps.findIndex((_, i) => ns.every(n => touches(i, n)));
      return both >= 0 ? both : later;
    }
    return asmSteps.findIndex((_, i) => ns.some(n => touches(i, n)));
  }
  function buildToFocus() {
    const j = focusStep(focus);
    if (j < 0) return;
    if (j !== stepIx) { stopPlay(); goStep(j); }
  }
  function focusParts() { return focus ? [...focus.nodes].flatMap(nodeParts) : []; }
  function applyFocusView() {
    if (building) return;                     // the build draws its own state
    clearAnnot();
    const parts = focusParts();
    highlight(parts.length ? parts : null);
    if (focus) { $("note").innerHTML = `<b>${focus.sel.type === "link" ? "Interfaces" : "Focus"}</b> ${focus.label}`; $("note").classList.add("show"); }
    else $("note").classList.remove("show");
  }
  function setFocus(sel) {
    dgSel = sel; focus = focusOf(sel);
    reqFilter = focus ? { ids: [...focus.reqs], label: focus.label } : null;
    selReq = null;
    renderReqs(); renderTree(); renderInterfaces(); filterBuild(); renderDiagram(); updateFilterBar();
    applyFocusView();
    if (building && focus) buildToFocus();
  }
  function updateFilterBar() {
    const pane = [...document.querySelectorAll(".pane")].find(p => !p.hidden)?.id;
    let n = "";
    if (focus) {
      if (pane === "p-req") n = `${focus.reqs.size} requirement${focus.reqs.size === 1 ? "" : "s"}`;
      else if (pane === "p-if") n = `${focus.ifaces.size} interface${focus.ifaces.size === 1 ? "" : "s"}`;
      else if (pane === "p-asm") { const k = stepNodes.filter(s => [...focus.nodes].some(x => s.has(x))).length; n = `${k} of ${asmSteps.length} build steps`; }
      else if (pane === "p-tree") n = `${focus.nodes.size} block${focus.nodes.size === 1 ? "" : "s"}`;
      else if (pane === "p-as") n = "assumptions are not tied to blocks, so all are shown";
    }
    $("filter").classList.toggle("show", !!focus);
    if (focus) $("filter-t").innerHTML = `Showing <b>${focus.label}</b>${n ? " · " + n : ""}`;
  }
  function filterBuild() {
    let lastH = null, any = false;
    const hs = [];
    $("p-asm").querySelectorAll(".section-h, .step").forEach(el => {
      if (el.classList.contains("section-h")) { if (lastH) lastH.hidden = !any; lastH = el; any = false; return; }
      const ok = !focus || [...focus.nodes].some(x => stepNodes[+el.dataset.ix].has(x));
      el.hidden = !ok; if (ok) any = true;
    });
    if (lastH) lastH.hidden = !any;
  }

  // the diagram follows the 3D view: a block fades when its parts are faint or not built yet
  const nodeMeshes = Object.fromEntries(Object.keys(DG.nodes).map(id => [id, [...expand(nodeParts(id))].map(n => meshes[n]).filter(Boolean)]));
  let dgLast = "", dgTick = 0;
  function dgReflect() {
    if (++dgTick % 5) return;
    const st = {};
    for (const [id, ms] of Object.entries(nodeMeshes)) {
      let vis = 0, lit = 0, hot = 0;
      for (const m of ms) {
        if (!m.visible) continue; vis++;
        if (m.material.opacity > 0.5) lit++;
        const em = m.material.emissive; if (em && em.r + em.g + em.b > 0.01) hot++;
      }
      st[id] = !ms.length ? "" : vis === 0 ? "unbuilt" : lit === 0 ? "faint" : (building && vis < ms.length ? "part" : "") + (hot && building ? " hot" : "");
    }
    const sig = JSON.stringify(st) + building;
    if (sig === dgLast) return; dgLast = sig;
    const svgEl = $("dg-svg");
    const gone = (id) => /unbuilt|faint/.test(st[id] || "");
    for (const [id, c] of Object.entries(st)) {
      const g = svgEl.querySelector(`.dg-node[data-node="${id}"]`); if (!g) continue;
      g.classList.remove("unbuilt", "faint", "part", "hot");
      c.split(" ").filter(Boolean).forEach(k => g.classList.add(k));
    }
    for (const [e, v] of Object.entries(DG.ext)) svgEl.querySelector(`.dg-ext[data-node="ext:${e}"]`)?.classList.toggle("faint", v[2].every(gone));
    svgEl.querySelectorAll(".dg-link").forEach(g => {
      const ends = [g.dataset.a, g.dataset.b].filter(x => !x.startsWith("ext:"));
      g.classList.toggle("faint", ends.some(gone));
    });
  }

  // ------------------------------------------------------------- render loop
  function resize() {
    const w = view.clientWidth, h = view.clientHeight;
    renderer.setSize(w, h, false); aspect = w / h; frustum();
  }
  new ResizeObserver(resize).observe(view);
  function themeColours() {
    renderer.setClearColor(new THREE.Color(css("--viewer")));
    const ink = new THREE.Color(css("--ink")); gmat.color = ink; gmat2.color = ink;
  }
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeColours);
  new MutationObserver(themeColours).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  const v3 = new THREE.Vector3();
  function frame(now) {
    if (anim) anim(now);
    if (buildAnim) buildAnim(now);
    dgReflect();
    controls.update();
    renderer.render(scene, camera);
    const w = view.clientWidth, h = view.clientHeight;
    for (const l of labels) {
      v3.copy(l.pos).project(camera);
      l.el.style.left = ((v3.x + 1) / 2 * w) + "px"; l.el.style.top = ((1 - v3.y) / 2 * h) + "px";
      l.el.style.display = v3.z < 1 ? "block" : "none";
    }
    requestAnimationFrame(frame);
  }
  renderReqs(); renderTree(); renderInterfaces(); renderAssumptions(); renderBuild(); renderDiagram(); updateFilterBar();
  themeColours(); resize(); setView("iso"); applyPose();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
